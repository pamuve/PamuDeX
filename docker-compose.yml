# PamuDeX — despliegue LOCAL, construyendo la imagen desde este mismo repo.
#
# Para el homelab con Portainer NO uses este archivo: usa
# `deploy/portainer-stack.yml`, que consume la imagen ya construida por GitHub
# Actions en ghcr.io en vez de compilarla en tu servidor. Aquí se construye
# porque en local se está tocando el código; allí eso solo sería esperar diez
# minutos a que Vite compile lo que ya está compilado.
services:
  pamudex:
    build:
      context: .
      args:
        # Sella la imagen con lo que haya en el entorno; en local no suele haber
        # nada y se queda en "dev", que es la respuesta correcta.
        VERSION: ${VERSION:-dev}
        COMMIT: ${COMMIT:-}
        BUILD_DATE: ${BUILD_DATE:-}
    image: pamudex:latest
    container_name: pamudex
    restart: unless-stopped
    ports:
      - "4000:4000"
    volumes:
      # El volumen va en /data, que contiene SOLO la base de datos.
      #
      # No lo cambies a /app/backend/db: ahí vive el código (schema.sql, seed.js,
      # populate.js, migrate.js). Docker únicamente copia el contenido de la
      # imagen a un volumen VACÍO, así que el volumen acabaría con una copia
      # congelada de ese código y las actualizaciones de la imagen no llegarían
      # jamás — un archivo nuevo tumbaría el contenedor al arrancar.
      - pamudex_db:/data
    # El healthcheck ya viene DENTRO de la imagen (ver el HEALTHCHECK del
    # Dockerfile), así que no hace falta repetirlo aquí: cualquier forma de
    # arrancarla lo hereda. /api/health responde desde el propio Express sin
    # tocar SQLite, y start_period cubre la siembra inicial, que en el primer
    # arranque crea 1025 Pokémon y 2151 objetos antes de escuchar en el puerto.
    #
    # OJO: `restart: unless-stopped` NO reinicia un contenedor por quedar
    # unhealthy — Docker solo reacciona a que el proceso muera. Esto deja el
    # estado a la vista en `docker ps` y lo publica para un proxy o un
    # orquestador; para reiniciar solo hace falta Swarm/Kubernetes o un
    # vigilante tipo autoheal.
    #
    # `docker stop` da 10 segundos antes del SIGKILL y a PamuDeX le sobran:
    # server.js atiende SIGTERM, cierra SQLite y sale en milisegundos.
    stop_grace_period: 30s

volumes:
  pamudex_db:
