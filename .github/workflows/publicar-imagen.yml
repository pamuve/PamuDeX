# PamuDeX — construye la imagen y la publica en GHCR.
#
# EL CIRCUITO COMPLETO
# --------------------
#   git push a main  ->  este workflow verifica y construye la imagen
#                    ->  la sube a ghcr.io/pamuve/pamudex:latest
#                    ->  Portainer, que consulta el repo cada X minutos,
#                        redespliega el stack y se baja la imagen nueva
#                    ->  el contenedor arranca, migra el esquema (con copia de
#                        seguridad previa) y conserva perfiles y sesiones.
#
# NO SE PUBLICA NADA SI LA VERIFICACIÓN FALLA: el job `publicar` depende de
# `verificar`. Es lo que impide que un error de tipos acabe desplegado solo.
#
# ANTES DE LA PRIMERA VEZ: el paquete de GHCR nace PRIVADO aunque el repositorio
# sea público. Después del primer build hay que ir a GitHub -> tu perfil ->
# Packages -> pamudex -> Package settings y ponerlo en Public, o Portainer no
# podrá descargarlo sin credenciales. Ver docs/DESPLIEGUE.md.
name: Publicar imagen

on:
  push:
    branches: [main]
    tags: ["v*"]
  # Para reconstruir a mano desde la pestaña Actions sin tocar el código.
  workflow_dispatch:

# Dos push seguidos no construyen dos imágenes a la vez: la primera se cancela.
# Publicar en orden importa cuando el tag es `latest`.
concurrency:
  group: imagen-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    uses: ./.github/workflows/verificacion.yml

  publicar:
    needs: verificar
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Necesario para subir a GHCR con el GITHUB_TOKEN automático. No hay que
      # crear ningún secreto ni token personal.
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Fecha del build
        id: fecha
        run: echo "valor=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Calcular tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          # En minúsculas SIEMPRE: el repositorio se llama PamuDeX, pero GHCR
          # rechaza las mayúsculas en el nombre de la imagen.
          images: ghcr.io/pamuve/pamudex
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}

      - name: Construir y publicar
        uses: docker/build-push-action@v6
        with:
          context: .
          # Solo amd64. Añadir arm64 obliga a emular con QEMU y multiplica el
          # tiempo de build; si algún día el homelab cambia de máquina, aquí se
          # pone linux/amd64,linux/arm64.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ steps.fecha.outputs.valor }}
          # La caché de capas de GitHub ahorra lo caro de cada build: la
          # instalación de dependencias y la descarga de los 1025 sprites.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Resumen
        run: |
          {
            echo "### Imagen publicada"
            echo ""
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo ""
            echo "Commit: \`${{ github.sha }}\`"
            echo ""
            echo "Portainer la recogerá en su siguiente comprobación."
            echo "Para comprobar qué versión hay desplegada: \`/api/version\`."
          } >> "$GITHUB_STEP_SUMMARY"
